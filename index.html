<!DOCTYPE html>

<head>

    <title>Digital Badge - Pattharaprapha Wongmuengklang</title>

    <style>

        }

        h1 {

            margin-bottom: 12px;
        }

        .student-id {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .major {
            font-size: 17px;
            margin-bottom: 25px;
        }

        h2 {
            margin-bottom: 12px;
            font-size: 22px;
        }

        .goal {
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .version {
            display: inline-block;
            padding: 10px 20px;
            background: #4caf72;
            color: white;
            border-radius: 30px;
            font-weight: bold;
        }
